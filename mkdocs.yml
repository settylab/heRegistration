site_name: hexenium
site_description: H&E ↔ Xenium registration pipeline
site_url: https://settylab.github.io/heRegistration/
repo_url: https://github.com/settylab/heRegistration
repo_name: settylab/heRegistration
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Usage: usage.md
  - Stages:
      - stages/he_preprocess.md
      - stages/register.md
      - stages/warp.md
      - stages/celltype.md
      - stages/viz.md
  - Configuration: configuration.md
  - HPC / Slurm: hpc.md
  - Advanced: advanced.md
  - Troubleshooting: troubleshooting.md
  - Methods: methods.md
  - Development: development.md
