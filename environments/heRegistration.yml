# Name intentionally omitted so the caller picks the env name at create time:
#   conda env create -n <your-env-name> -f environments/heRegistration.yml
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=1.26.4
  - scipy
  - pandas
  - pyarrow=23
  - pyyaml
  - matplotlib=3.10
  - scikit-image=0.19
  - scikit-learn=1.8
  - shapely=2.1
  # geopandas 1.1.x pulls pandas>=2.0, but valis-wsi 1.1 hard-pins
  # pandas<2.0. Cap geopandas at <1.0 (0.14 line) so pandas 1.x is
  # allowed; dask/dask-geopandas cascade down to versions still on
  # pandas 1.x (dask 2025.1+ requires pandas>=2, dask-geopandas 0.5
  # requires dask>=2025.1). See settylab/TracyY123-nexus#15.
  - geopandas<1.0
  - dask<2025.1
  - dask-geopandas<0.5
  - distributed
  # OpenSlide C library + Python binding. Pinning both via conda
  # avoids the pip `openslide-bin` fallback (no wheels for older
  # glibc, e.g. rhino02) that HEST HEAD pulls in transitively via
  # TRIDENT.
  - openslide
  - openslide-python=1.4
  # Loose tifffile: pin=2026.1 pulled in imagecodecs>=2025.11.11 which
  # collides with libdeflate on older solvers. Any recent tifffile is
  # API-compatible for what we use.
  - tifffile>=2024.5
  # Keep libvips available system-side (loose pin); pyvips itself is
  # installed via pip below to sidestep the pyvips->libvips->gdk-pixbuf
  # /librsvg cascade that older libmamba builds fail to solve.
  - libvips>=8.13
  # libvips loads its magick loader (vips-modules-8.18/vips-magick.so)
  # at process start via dlopen. Without ImageMagick in the env, it
  # emits `libMagickCore-7.Q16HDRI.so.10: cannot open shared object
  # file` on every import — noisy for users even though the code paths
  # we use don't touch the magick loader. Conda-forge `imagemagick`
  # 7.1.2 ships that exact SONAME. See settylab/TracyY123-nexus#15.
  - imagemagick
  - openjdk=11
  - jpype1=1.6
  - anndata=0.11
  # Loose scanpy: hard-pin =1.11 was unresolvable on older solvers;
  # any 1.10-1.12 satisfies the code paths we use.
  - scanpy>=1.10,<1.13
  - opencv
  # The image-registration libraries live on PyPI / GitHub. pyvips is
  # also pip-installed so the solver isn't forced through the messy
  # conda pyvips<->libvips constraint chain.
  - pip
  - pip:
      - "pyvips>=2.2,<3"
      - valis-wsi==1.1
      - valis-hest==0.0.2
      # HEST is an editable clone in the reference README (patched
      # locally); install from GitHub for a fresh env. Pinned to
      # v1.2.0: HEST HEAD requires TRIDENT, which pulls in
      # `openslide-bin` — a pip-only package whose sdist build fails
      # on older glibc (rhino02) and whose wheels don't cover this
      # platform. v1.2.0 (HEST 1.1.1) predates the TRIDENT dep and
      # matches the currently working env.
      - "hest @ git+https://github.com/mahmoodlab/HEST.git@v1.2.0"
