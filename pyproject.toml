[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexenium"
version = "0.2.0"
description = "H&E ↔ Xenium DAPI registration + warp + celltyping + visualisation pipeline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Tracy Yang" },
]
keywords = ["xenium", "spatial-transcriptomics", "H&E", "VALIS", "HEST", "registration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Pins mirror the tested `heRegistration` conda env
# (environments/heRegistration.yml). The heavy image-registration
# libraries (valis-wsi, valis-hest, hest) are pip-only and need
# `--no-deps` (see the yaml header); a plain `pip install .`
# outside the conda env will refuse to install valis-wsi against
# pandas>=2 because valis-wsi 1.1's declared Requires-Dist caps
# pandas<2. Use the conda env for reproducible installs; keep the
# pyproject deps loose so `pip install -e .` inside that env does
# not attempt to downgrade the working-env versions.
dependencies = [
    "numpy<2",
    "pandas<3",
    "scipy",
    "pyarrow",
    "pyyaml",
    "matplotlib",
    "scikit-image",
    "scikit-learn",
    "shapely",
    "geopandas",
    "dask",
    "dask-geopandas",
    "distributed",
    "openslide-python",
    "tifffile",
    "anndata",
    "scanpy",
    "opencv-python",
    "jpype1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
hexenium = "hexenium.cli:main"

[project.urls]
Homepage = "https://github.com/settylab/xenium-he-registration"
Issues = "https://github.com/settylab/xenium-he-registration/issues"
Repository = "https://github.com/settylab/xenium-he-registration"

[tool.setuptools.package-data]
hexenium = ["../../config/default.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
