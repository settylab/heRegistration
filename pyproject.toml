[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexenium"
version = "0.2.0"
description = "H&E ↔ Xenium DAPI registration + warp + celltyping + visualisation pipeline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Tracy Yang" },
]
keywords = ["xenium", "spatial-transcriptomics", "H&E", "VALIS", "HEST", "registration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Pins mirror the tested `heRegistration` conda env
# (environments/heRegistration.yml). The heavy image-registration
# libraries (valis-wsi, valis-hest, hest) may need to be installed
# outside a plain `pip install`; the environment.yml carries the
# full set including the git-installed HEST.
dependencies = [
    "numpy==1.26.4",
    "scipy",
    "pandas",
    "pyarrow==23.*",
    "pyyaml",
    "matplotlib==3.10.*",
    "scikit-image==0.19.*",
    "scikit-learn==1.8.*",
    "shapely==2.1.*",
    # geopandas/dask/dask-geopandas capped: valis-wsi 1.1 pins
    # pandas<2, but geopandas>=1.0 and dask>=2025.1 both require
    # pandas>=2. Mirror the conda env yaml.
    "geopandas<1.0",
    "dask<2025.1",
    "dask-geopandas<0.5",
    "distributed",
    "openslide-python==1.4.*",
    "tifffile==2026.1.*",
    "anndata==0.11.*",
    "scanpy==1.11.*",
    "opencv-python",
    "jpype1==1.6.*",
    "valis-wsi==1.1",
    "valis-hest==0.0.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
hexenium = "hexenium.cli:main"

[project.urls]
Homepage = "https://github.com/settylab/xenium-he-registration"
Issues = "https://github.com/settylab/xenium-he-registration/issues"
Repository = "https://github.com/settylab/xenium-he-registration"

[tool.setuptools.package-data]
hexenium = ["../../config/default.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
