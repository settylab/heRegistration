# Default configuration for the hexenium pipeline.
# Every value here can be overridden on the CLI (--key value) or by a
# user YAML passed with --config user.yaml (only override what you need).

# ----- I/O ----------------------------------------------------------
# Three invocation modes:
#   * standalone            — sample_id + he_path + xenium_bundle + output_root
#                             (+ proseg_purified_h5ad for the celltype stage).
#   * integrated-by-run-id  — same, plus run_id. Derives the xenium h5ad from
#                             <output_root>/<sample>/<sample>_<run_id>/spatial_adata/
#                             <sample>_xenium_ranger.h5ad and colocates outputs under
#                             <output_root>/<sample>/<sample>_<run_id>/he_registration/.
#   * integrated-by-h5ad    — xenium_h5ad (+ he_path + xenium_bundle). Sample
#                             identity is read from .uns['sample_id'] /
#                             .uns['run_id']; outputs colocate under
#                             <xenium_run_dir>/he_registration/.
sample_id: null                  # standalone / by-run-id: required; by-h5ad: auto from .uns
he_path: null                    # REQUIRED on CLI: full path to H&E (any name)
xenium_bundle: null              # REQUIRED on CLI: dir holding morphology_focus/, cell_boundaries.parquet, ...
# The xenium h5ad written by an upstream xenium-preprocess
# xenium_ranger_to_anndata stage. When set, activates integrated mode +
# becomes the celltype QUERY side. Leave null for standalone.
xenium_h5ad: null
# The upstream proseg_purified h5ad. Its .obs carries the celltype
# labels + centroids that get NN-mapped onto every xenium cell.
# REQUIRED for the celltype stage.
proseg_purified_h5ad: null
# DAPI / morphology image used as the moving image for registration.
# If null, derives from <xenium_bundle>/morphology_focus/morphology_focus_0000.ome.tif
# (the standard Xenium output bundle layout). Set this explicitly when
# your DAPI lives at a non-standard path (e.g. multichannel bundles
# where DAPI is morphology_focus/ch0000_dapi.ome.tif).
dapi_path: null
output_root: null                # REQUIRED on CLI (standalone / by-run-id modes): parent directory for pipeline outputs
force_rerun: false               # nuke per-stage sentinels and re-run
# he_job_id — per-invocation label used to shard every stage's output
# under <output_root_he>/<stage>/<he_job_id>/ (stage ∈
# {register, warp, celltyped, viz}). Precedence:
#   --he-job-id > $SLURM_JOB_ID > YYYYMMDDTHHMMSS timestamp.
# Leave null to let the pipeline resolve it. Override on the CLI when
# re-running against a specific prior <he_job_id>.
he_job_id: null
# When re-running celltype or viz alone (--stages celltype ... or
# --stages viz ...), these point the reading stage at the RIGHT prior
# <he_job_id> subfolder. Left null → same as the current run's he_job_id.
warp_run_id: null                # which warp/<id>/ to read from
celltype_run_id: null            # which celltyped/<id>/ to read from

# ----- Stage 0: VSI → OME-TIFF conversion --------------------------
# Only fires when --he-path is a .vsi file (Olympus SlideScanner);
# no-op for existing OME-TIFF inputs. Output lands next to the source
# VSI (canonical) or under the pipeline output tree (fallback when
# the source dir is read-only). Spec matches 10x's Xenium Explorer
# image-conversion tutorial: ZLIB or lossless JPEG 2000, pyramid scale
# 2, tile size 1024.
he_preprocess:
  tile_size: 1024                # Xenium Explorer requirement
  compression: jpeg2000          # jpeg2000 (with level=100) or zlib
  jpeg2000_level: 100            # 100 = lossless; <100 = LOSSY (rejected by Explorer)
  pyramid_levels: 7              # matches the Xenium Explorer omeconvert.py default

# ----- H&E preprocessing (input encoding side) ---------------------
he:
  # The pipeline symlinks the input H&E to "aligned_fullres_HE.ome.tif"
  # inside the per-sample workdir before calling HEST. This sidesteps
  # the hardcoded he_key='aligned_fullres_HE' in valis_hest's "Paul fix"
  # without modifying HEST itself. Set false only if your H&E is
  # already literally named aligned_fullres_HE.ome.tif.
  symlink_to_canonical_name: true

# ----- Registration mode (algorithm topology) ----------------------
registration:
  # `mode` default is `full_with_micro`: matches stock HEST
  # `register_dapi_he(micro_reg=True)` — the fullest transform stack.
  # `rigid_only` and `rigid_nonrigid` remain available via `--mode` for
  # diagnostic sweeps and can be preferable on some samples.
  # `rigid_only`       — just rigid; fastest.
  # `rigid_nonrigid`   — rigid + non-rigid solve at max_processed_image_dim_px.
  # `full_with_micro`  — rigid + non-rigid + micro-registration refinement.
  # NOTE: `rigid_only_micro` is REMOVED — register_micro requires bk_dxdy from
  # an initial non-rigid pass; combining rigid-only init with micro = TypeError.
  mode: full_with_micro    # rigid_only | rigid_nonrigid | full_with_micro
  # `use_he_deconvolution` default is `true`. Macenko-style H&E stain
  # deconvolution before registration; on faint-hematoxylin samples it
  # can degrade alignment — override with `--use-he-deconvolution false`
  # in that case.
  use_he_deconvolution: true
  check_for_reflections: true    # Catches mirror/flip failures cheaply.
  create_masks: false            # Auto-mask can over-mask small tissue islands.
  align_to_reference: true       # H&E is the reference image.

# ----- Numeric algorithm parameters --------------------------------
parameters:
  # `max_image_dim_px` — valis_hest.registration.Valis kwarg. Caps the
  # max width/height of images that are SAVED (memory guard on the
  # pyramid level chosen for output). valis_hest constraint:
  # max_image_dim_px >= max_processed_image_dim_px; if lower it is
  # silently auto-bumped up with a warning. valis_hest's own default is
  # 1024; we default to 1500 to match max_processed_image_dim_px so the
  # auto-bump warning doesn't fire on the stock config.
  max_image_dim_px: 1500
  # `max_processed_image_dim_px` — valis_hest.registration.Valis kwarg.
  # Caps the size of PROCESSED images — the resolution at which features
  # are detected and displacement fields are computed. Main
  # alignment-quality/speed knob.
  max_processed_image_dim_px: 1500
  max_non_rigid_registration_dim_px: 10000
  micro_rigid_registrar_cls: null
  micro_rigid_registrar_params: {}
  name: null                     # registrar run name; auto = <sample_id>_<timestamp>

# ----- Warp stage --------------------------------------------------
warp:
  # Defaults to cells + nuclei (the fast path most runs use).
  # To also warp transcripts, either set include_transcripts: true here
  # or pass --include-transcripts on the CLI; that appends 'transcripts'
  # to the targets list. You can also override the whole list with
  # --warp-targets cells nuclei transcripts.
  targets: [cells, nuclei]
  include_transcripts: false
  use_dask: true
  save_geojson: true
  dask:
    n_workers: 1
    threads_per_worker: 1
    memory_limit: 32GB
    jvm_mem_gb: 1

# ----- Cell-type annotation ----------------------------------------
# Source of celltype is the upstream proseg_purified.h5ad (fitted on
# its centroids + celltype .obs column); query is xenium_h5ad. Every
# xenium cell is labelled — no mark_unassigned policy.
celltype:
  # Path override for the query xenium h5ad. Falls back to the
  # top-level `xenium_h5ad:` key (integrated mode) if null.
  xenium_h5ad: null
  # Path override for the source proseg_purified h5ad. Falls back to
  # the top-level `proseg_purified_h5ad:` key if null.
  proseg_purified_h5ad: null
  # Auto-detect precedence for the celltype .obs column on
  # proseg_purified.h5ad: celltype > first_type > primary_cell_type >
  # celltype_updated. Pass a literal column name to force a choice.
  celltype_col: auto
  # Auto-detect precedence for the xenium-side id column. Every
  # candidate is UUID-shape-checked (regex ^[a-z]{8}-\d+$) before use,
  # so this can't silently pick Proseg's int64 index masquerading as
  # "cell_id". Special value: "__index__" reads from .obs.index.
  id_col: auto
  # Centroid columns on each side. Leave null to auto-detect via the
  # fallback chain (see celltyping._resolve_spatial_coords):
  #   1. .obsm['spatial'] (scanpy / Xenium-in-place convention)
  #   2. .obs['centroid_x'] / .obs['centroid_y'] (proseg_to_anndata)
  #   3. .obs['x_centroid'] / .obs['y_centroid'] (xenium_ranger)
  #   4. .obs['x'] / .obs['y'] (generic)
  # Set explicit column names below only to override the auto-detect
  # (e.g. two candidate obs pairs coexist and you want a specific one).
  proseg_x_col: null
  proseg_y_col: null
  xenium_x_col: null
  xenium_y_col: null
  # NN algorithm. k=1 is the default (proseg segmentation is
  # fine-grained enough that k=1 is well-motivated).
  nn_k: 1
  nn_algorithm: auto          # sklearn: auto | ball_tree | kd_tree | brute
  nn_metric: euclidean
  nuclei_inherit_classification: true   # nuclei without label inherit from sibling cell
  area_threshold_px: 20          # drop polygons smaller than this
  # Rounding for the ANALYSIS output files (raw floats by default so
  # downstream analysis retains full precision). The QuPath output files
  # (see qupath_*_round_ndigits below) always round.
  cell_round_ndigits: null
  nucleus_round_ndigits: null
  # Rounding for the QuPath / visualisation output files. 2 decimals is
  # coarse enough for QuPath's polygon renderer to accept + the pipeline
  # also runs polygon-safety cleanup on these outputs to avoid "invalid
  # polygon" errors in QuPath.
  qupath_cell_round_ndigits: 2
  qupath_nucleus_round_ndigits: 2

# ----- Visualisation -----------------------------------------------
viz:
  enabled: true
  thumbnail_max_dim: 4096        # downsample H&E to this max dimension for plotting
  dpi: 200
  cell_alpha: 0.3
  nucleus_alpha: 0.6
  # Which boundaries to draw on the overlay. Default is `nucleus` —
  # nuclei alone give the cleanest read of registration quality against
  # H&E's hematoxylin-stained nuclei.
  # `cell`    — only cell polygons (semi-transparent fill).
  # `nucleus` — only nucleus outlines.
  # `both`    — nuclei + cell polygons.
  render_boundaries: nucleus     # cell | nucleus | both
  # classification_palette: OPTIONAL overrides for specific labels. Any
  # celltype that isn't listed here gets a color auto-assigned from
  # `palette_cmap` (see below) at run time — so the viz always colors
  # every label distinctly. Keys are case-sensitive and must match the
  # celltype label exactly. The block below is an example set from a
  # solid-tumor / immune cohort — edit freely.
  classification_palette:
    Tumor:       [220,  20,  60]
    "T/NK":      [ 65, 105, 225]
    Myeloid:     [138,  43, 226]
    Fibroblast:  [ 34, 139,  34]
    Endothelial: [255, 165,   0]
    Mast:        [255, 105, 180]
    "B/Plasma":  [128,   0, 128]
    Unclassified: [180, 180, 180]
  # Matplotlib qualitative colormap used to auto-assign colors to any
  # celltype label that isn't in classification_palette above. tab20
  # gives 20 distinct hues; use tab10 for fewer, or 'Set3' / 'Paired'
  # for pastel palettes. Assignment order = first-appearance in the
  # data (deterministic across re-runs).
  palette_cmap: tab20
